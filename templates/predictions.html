{% extends "base_v2.html" %}

{% block title %}人数预测 - 校园活地图{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>
                    <i class="fas fa-chart-line me-2"></i>
                    AI智能预测
                </h2>
                {% if current_user.role == 'admin' %}
                <button class="btn btn-primary" onclick="trainModel()">
                    <i class="fas fa-brain me-2"></i>训练模型
                </button>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- 说明卡片 -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                <div class="card-body">
                    <h5 class="card-title">
                        <i class="fas fa-lightbulb me-2"></i>
                        关于AI预测
                    </h5>
                    <p class="mb-0">
                        基于历史上报数据，使用机器学习算法（随机森林）预测未来时段的教室拥挤度。
                        预测考虑了时间、星期、空间类型、历史趋势等多个因素。
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- 空间选择 -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <label class="form-label fw-bold">选择空间查看详细预测</label>
                    <select class="form-select" id="spaceSelect" onchange="loadSpacePrediction()">
                        <option value="">请选择空间...</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 所有空间预测概览 -->
    <div class="row mb-4">
        <div class="col-12">
            <h4 class="mb-3">
                <i class="fas fa-clock me-2"></i>
                下一小时预测
            </h4>
        </div>
    </div>

    <div class="row" id="allPredictionsList">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-3 text-muted">正在加载预测数据...</p>
        </div>
    </div>

    <!-- 详细预测图表 -->
    <div class="row mt-5" id="detailPredictionSection" style="display: none;">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-chart-area me-2"></i>
                        未来6小时预测趋势
                    </h5>
                </div>
                <div class="card-body">
                    <div id="predictionChart" style="height: 300px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.prediction-card {
    transition: all 0.3s ease;
    border-radius: 15px;
    overflow: hidden;
}

.prediction-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.15) !important;
}

.crowding-indicator {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(90deg, #10B981 0%, #F59E0B 50%, #EF4444 100%);
    position: relative;
    margin: 1rem 0;
}

.crowding-marker {
    position: absolute;
    top: -4px;
    width: 16px;
    height: 16px;
    background: white;
    border: 3px solid #4F46E5;
    border-radius: 50%;
    transform: translateX(-50%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.prediction-value {
    font-size: 2.5rem;
    font-weight: bold;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.time-slot {
    padding: 1rem;
    border-radius: 10px;
    background: #F9FAFB;
    margin-bottom: 0.5rem;
    transition: all 0.2s;
}

.time-slot:hover {
    background: #F3F4F6;
    transform: translateX(5px);
}
</style>

<script>
let allSpaces = [];
let currentPredictions = [];

// 页面加载时获取数据
document.addEventListener('DOMContentLoaded', function() {
    loadAllPredictions();
    loadSpaces();
});

// 加载所有空间列表
async function loadSpaces() {
    try {
        const response = await fetch('/api/spaces');
        const data = await response.json();
        
        if (response.ok) {
            allSpaces = data;
            const select = document.getElementById('spaceSelect');
            data.forEach(space => {
                const option = document.createElement('option');
                option.value = space.id;
                option.textContent = `${space.name} - ${space.location}`;
                select.appendChild(option);
            });
        }
    } catch (error) {
        console.error('Error:', error);
    }
}

// 加载所有空间的预测
async function loadAllPredictions() {
    try {
        const response = await fetch('/api/ml/predict-all');
        const data = await response.json();
        
        if (response.ok) {
            displayAllPredictions(data);
        } else {
            showError('加载预测失败');
        }
    } catch (error) {
        console.error('Error:', error);
        showError('网络错误');
    }
}

// 显示所有预测
function displayAllPredictions(predictions) {
    const container = document.getElementById('allPredictionsList');
    
    if (predictions.length === 0) {
        container.innerHTML = `
            <div class="col-12 text-center py-5">
                <i class="fas fa-chart-line fa-3x text-muted mb-3"></i>
                <p class="text-muted">暂无预测数据</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = predictions.map(p => {
        const crowding = p.next_hour.crowding_level;
        const percentage = ((crowding - 1) / 4) * 100;
        
        return `
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card prediction-card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="fas fa-map-marker-alt me-2" style="color: ${p.next_hour.color}"></i>
                            ${p.space_name}
                        </h5>
                        <p class="text-muted small mb-3">
                            <i class="fas fa-location-dot me-2"></i>${p.location}
                        </p>
                        
                        <div class="text-center mb-3">
                            <div class="prediction-value">${crowding.toFixed(1)}</div>
                            <div class="text-muted">预测拥挤度</div>
                        </div>
                        
                        <div class="crowding-indicator">
                            <div class="crowding-marker" style="left: ${percentage}%;"></div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge" style="background-color: ${p.next_hour.color}; font-size: 0.9rem;">
                                ${p.next_hour.crowding_text}
                            </span>
                            <span class="text-muted small">
                                <i class="fas fa-clock me-1"></i>${p.next_hour.time}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

// 加载单个空间的详细预测
async function loadSpacePrediction() {
    const spaceId = document.getElementById('spaceSelect').value;
    
    if (!spaceId) {
        document.getElementById('detailPredictionSection').style.display = 'none';
        return;
    }
    
    try {
        const response = await fetch(`/api/ml/predict/${spaceId}?hours=6`);
        const data = await response.json();
        
        if (response.ok) {
            currentPredictions = data.predictions;
            displayDetailPrediction(data);
            document.getElementById('detailPredictionSection').style.display = 'block';
        } else {
            showError('加载预测失败');
        }
    } catch (error) {
        console.error('Error:', error);
        showError('网络错误');
    }
}

// 显示详细预测
function displayDetailPrediction(data) {
    const chartContainer = document.getElementById('predictionChart');
    
    const html = data.predictions.map(p => `
        <div class="time-slot">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <strong>${p.time}</strong>
                    <span class="badge ms-2" style="background-color: ${p.color}">
                        ${p.crowding_text}
                    </span>
                </div>
                <div class="text-end">
                    <span class="fs-4 fw-bold" style="color: ${p.color}">
                        ${p.crowding_level.toFixed(1)}
                    </span>
                    <span class="text-muted">/5.0</span>
                </div>
            </div>
            <div class="progress mt-2" style="height: 10px;">
                <div class="progress-bar" role="progressbar" 
                     style="width: ${(p.crowding_level / 5) * 100}%; background-color: ${p.color}">
                </div>
            </div>
        </div>
    `).join('');
    
    chartContainer.innerHTML = html;
}

// 训练模型（仅管理员）
async function trainModel() {
    if (!confirm('确定要重新训练预测模型吗？这可能需要几分钟时间。')) {
        return;
    }
    
    const btn = event.target;
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>训练中...';
    
    try {
        const response = await fetch('/api/ml/train', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model_type: 'random_forest'
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            showSuccess(data.message);
            loadAllPredictions();
        } else {
            showError(data.error || '训练失败');
        }
    } catch (error) {
        console.error('Error:', error);
        showError('网络错误');
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}

// 显示成功消息
function showSuccess(message) {
    if (typeof showToast === 'function') {
        showToast(message, 'success');
    } else {
        alert(message);
    }
}

// 显示错误消息
function showError(message) {
    if (typeof showToast === 'function') {
        showToast(message, 'error');
    } else {
        alert(message);
    }
}
</script>
{% endblock %}
