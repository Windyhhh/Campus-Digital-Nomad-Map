<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" style="background: linear-gradient(135deg, #e8f5e8 0%, #f0f8f0 100%);">
  <!-- 校园背景 -->
  <defs>
    <pattern id="grass" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#e8f5e8"/>
      <circle cx="5" cy="5" r="1" fill="#d4edda" opacity="0.5"/>
      <circle cx="15" cy="15" r="1" fill="#d4edda" opacity="0.5"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 校园道路 -->
  <path d="M0 350 L1000 350" stroke="#cccccc" stroke-width="8" opacity="0.7"/>
  <path d="M200 0 L200 700" stroke="#cccccc" stroke-width="6" opacity="0.7"/>
  <path d="M500 0 L500 700" stroke="#cccccc" stroke-width="6" opacity="0.7"/>
  <path d="M800 0 L800 700" stroke="#cccccc" stroke-width="6" opacity="0.7"/>
  
  <!-- 绿化带 -->
  <ellipse cx="150" cy="150" rx="80" ry="40" fill="#90EE90" opacity="0.6"/>
  <ellipse cx="350" cy="550" rx="60" ry="30" fill="#90EE90" opacity="0.6"/>
  <ellipse cx="650" cy="150" rx="70" ry="35" fill="#90EE90" opacity="0.6"/>
  <ellipse cx="850" cy="500" rx="50" ry="25" fill="#90EE90" opacity="0.6"/>
  
  <!-- 主要建筑物 -->
  
  <!-- 图书馆 (大型建筑) -->
  <rect x="50" y="80" width="200" height="120" fill="#ffffff" stroke="#007bff" stroke-width="3" rx="8" filter="url(#shadow)"/>
  <rect x="60" y="90" width="180" height="20" fill="#007bff" opacity="0.1"/>
  <text x="150" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#007bff">图书馆</text>
  <text x="150" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Library</text>
  
  <!-- A座教学楼 -->
  <rect x="280" y="80" width="150" height="100" fill="#ffffff" stroke="#28a745" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="355" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745">A座教学楼</text>
  <text x="355" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Teaching Building A</text>
  
  <!-- B座教学楼 -->
  <rect x="460" y="80" width="150" height="100" fill="#ffffff" stroke="#28a745" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="535" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745">B座教学楼</text>
  <text x="535" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Teaching Building B</text>
  
  <!-- C座教学楼 -->
  <rect x="640" y="80" width="150" height="100" fill="#ffffff" stroke="#28a745" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="715" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745">C座教学楼</text>
  <text x="715" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Teaching Building C</text>
  
  <!-- 实验楼 -->
  <rect x="820" y="80" width="130" height="100" fill="#ffffff" stroke="#dc3545" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="885" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc3545">实验楼</text>
  <text x="885" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Lab Building</text>
  
  <!-- 学生活动中心 -->
  <rect x="50" y="220" width="180" height="110" fill="#ffffff" stroke="#6f42c1" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="140" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6f42c1">学生活动中心</text>
  <text x="140" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Student Activity Center</text>
  
  <!-- 咖啡厅 -->
  <rect x="260" y="240" width="120" height="80" fill="#ffffff" stroke="#fd7e14" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="320" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fd7e14">咖啡厅</text>
  <text x="320" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Cafe</text>
  
  <!-- 自习室区域 -->
  <rect x="410" y="220" width="160" height="90" fill="#ffffff" stroke="#17a2b8" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="490" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#17a2b8">自习室区域</text>
  <text x="490" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Study Rooms</text>
  
  <!-- 讨论室 -->
  <rect x="600" y="240" width="120" height="80" fill="#ffffff" stroke="#20c997" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="660" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#20c997">讨论室</text>
  <text x="660" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Discussion Room</text>
  
  <!-- 食堂 -->
  <rect x="50" y="380" width="160" height="100" fill="#ffffff" stroke="#ffc107" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="130" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffc107">食堂</text>
  <text x="130" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Dining Hall</text>
  
  <!-- 体育馆 -->
  <rect x="240" y="380" width="140" height="100" fill="#ffffff" stroke="#e83e8c" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="310" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e83e8c">体育馆</text>
  <text x="310" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Gymnasium</text>
  
  <!-- 宿舍区 -->
  <rect x="410" y="380" width="180" height="120" fill="#ffffff" stroke="#6c757d" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="500" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6c757d">学生宿舍</text>
  <text x="500" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Student Dormitory</text>
  
  <!-- 停车场 -->
  <rect x="620" y="400" width="120" height="80" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2" rx="6" stroke-dasharray="5,5"/>
  <text x="680" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">停车场</text>
  <text x="680" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Parking</text>
  
  <!-- 校园入口 -->
  <rect x="0" y="330" width="30" height="40" fill="#007bff" rx="4"/>
  <text x="15" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">入口</text>
  
  <!-- 指北针 -->
  <g transform="translate(920, 50)">
    <circle cx="0" cy="0" r="25" fill="white" stroke="#007bff" stroke-width="2" opacity="0.9"/>
    <path d="M0,-20 L5,0 L0,20 L-5,0 Z" fill="#dc3545"/>
    <text x="0" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#007bff">N</text>
  </g>
  
  <!-- 图例 -->
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="200" height="120" fill="white" stroke="#dee2e6" stroke-width="1" rx="6" opacity="0.95"/>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">图例 Legend</text>
    
    <circle cx="20" cy="40" r="6" fill="#28a745"/>
    <text x="35" y="45" font-family="Arial, sans-serif" font-size="11" fill="#333">空闲 Available</text>
    
    <circle cx="20" cy="60" r="6" fill="#ffc107"/>
    <text x="35" y="65" font-family="Arial, sans-serif" font-size="11" fill="#333">较忙 Busy</text>
    
    <circle cx="20" cy="80" r="6" fill="#dc3545"/>
    <text x="35" y="85" font-family="Arial, sans-serif" font-size="11" fill="#333">拥挤 Crowded</text>
    
    <circle cx="120" cy="40" r="6" fill="#007bff"/>
    <text x="135" y="45" font-family="Arial, sans-serif" font-size="11" fill="#333">有WiFi WiFi</text>
    
    <circle cx="120" cy="60" r="6" fill="#6f42c1"/>
    <text x="135" y="65" font-family="Arial, sans-serif" font-size="11" fill="#333">有电源 Power</text>
    
    <circle cx="120" cy="80" r="6" fill="#20c997"/>
    <text x="135" y="85" font-family="Arial, sans-serif" font-size="11" fill="#333">安静 Quiet</text>
  </g>
</svg>
